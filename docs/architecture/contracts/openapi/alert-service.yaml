openapi: 3.0.3
info:
  title: ColdTrace alert-service API
  version: 1.0.0
  description: |
    Endpoints nuevos de la Iteración 3 (Usabilidad). ADR-0013, ADR-0014, ADR-0015.
    Una "alerta" es una fila de `incidents`; `{id}` = `incidents.id`.
    Todas las operaciones se filtran por el `organizationId` del JWT; un recurso de otra organización responde 404.
servers:
  - url: http://localhost:8080
    description: API Gateway (local)
security:
  - bearerAuth: []
tags:
  - name: Alerts
paths:
  /api/v1/alerts/{id}/detail:
    get:
      tags: [Alerts]
      operationId: getAlertDetail
      summary: Todo el contexto de una alerta en una sola llamada (destino del deep link)
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: Detalle de la alerta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertDetail' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/alerts/{id}/acknowledgement:
    post:
      tags: [Alerts]
      operationId: acknowledgeAndAssign
      summary: Reconoce y asigna la alerta en una transacción (OPEN → ACKNOWLEDGED)
      parameters:
        - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assigneeUserId]
              properties:
                assigneeUserId: { type: integer, format: int64 }
      responses:
        '200':
          description: Reconocida y asignada; además se emite SSE alert.updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcknowledgementResult' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: La alerta no está en estado OPEN (code ALERT_NOT_OPEN)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Alerts]
      operationId: undoAcknowledgement
      summary: Deshace el reconocimiento dentro de los 10 s (ACKNOWLEDGED → OPEN)
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: Revertida; emite SSE alert.updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcknowledgementResult' }
        '409':
          description: Ventana vencida (code UNDO_WINDOW_EXPIRED) o estado inválido (code ALERT_NOT_ACKNOWLEDGED)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/alerts/stream:
    get:
      tags: [Alerts]
      operationId: streamAlerts
      summary: Server-Sent Events con los cambios de alertas de la organización del token
      description: |
        Formato de cada evento:
        ```
        event: alert.updated
        id: <eventId>
        data: {AlertUpdated JSON}
        ```
        Comentario de keep-alive (`: ping`) cada 25 s. El cliente reconecta con `Last-Event-ID`.
      responses:
        '200':
          description: Stream abierto
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/AlertUpdated' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AlertId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
  responses:
    Problem:
      description: Error (RFC 7807)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    AlertState:
      type: string
      enum: [OPEN, ACKNOWLEDGED, RESOLVED]
    UserRef:
      type: object
      required: [userId, fullName]
      properties:
        userId: { type: integer, format: int64 }
        fullName: { type: string }
    AlertDetail:
      type: object
      required: [id, type, severity, state, detectedAt, asset, allowedActions]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, description: 'Tipo existente del backend; NO_DATA para brechas (ADR-0007)' }
        severity: { type: string }
        state: { $ref: '#/components/schemas/AlertState' }
        detectedAt: { type: string, format: date-time }
        asset:
          type: object
          required: [assetId, name]
          properties:
            assetId: { type: integer, format: int64 }
            name: { type: string }
            locationName: { type: string, nullable: true }
        reading:
          type: object
          nullable: true
          properties:
            readingId: { type: integer, format: int64 }
            temperature: { type: number, format: double, nullable: true }
            humidity: { type: number, format: double, nullable: true }
            recordedAt: { type: string, format: date-time }
        safeRange:
          type: object
          nullable: true
          properties:
            minTemperature: { type: number, format: double }
            maxTemperature: { type: number, format: double }
            minHumidity: { type: number, format: double, nullable: true }
            maxHumidity: { type: number, format: double, nullable: true }
        assignee: { type: object, allOf: [{ $ref: '#/components/schemas/UserRef' }], nullable: true }
        suggestedAssignee:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          description: Usuario que reconoció la incidencia más reciente del mismo activo en 30 días; si no hay, el usuario autenticado.
        allowedActions:
          type: array
          items:
            type: string
            enum: [ACKNOWLEDGE_AND_ASSIGN, UNDO_ACKNOWLEDGEMENT, REGISTER_CORRECTIVE_ACTION, REQUEST_RESOLUTION_PLAN, RESOLVE]
    AcknowledgementResult:
      type: object
      required: [id, state]
      properties:
        id: { type: integer, format: int64 }
        state: { $ref: '#/components/schemas/AlertState' }
        assignee: { type: object, allOf: [{ $ref: '#/components/schemas/UserRef' }], nullable: true }
        acknowledgedAt: { type: string, format: date-time, nullable: true }
        undoAvailableUntil: { type: string, format: date-time, nullable: true }
    AlertUpdated:
      type: object
      required: [eventId, alertId, state, occurredAt]
      properties:
        eventId: { type: string, format: uuid }
        alertId: { type: integer, format: int64 }
        assetId: { type: integer, format: int64 }
        state: { $ref: '#/components/schemas/AlertState' }
        assigneeUserId: { type: integer, format: int64, nullable: true }
        occurredAt: { type: string, format: date-time }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
